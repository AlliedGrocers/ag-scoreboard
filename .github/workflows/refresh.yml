name: Refresh scoreboard

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC daily (~7am CT / 8am ET). Change the time here if you like.
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build index.html from ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name "ag-scoreboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change to publish."
          else
            git commit -m "Auto-refresh scoreboard ($(date -u +%F))"
            git push
          fi
